name: Deploy Dead Missions to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PAGES_SETUP_TOKEN is only needed to bootstrap Pages the first time.
      # Once the Pages site exists, the workflow can use the normal GITHUB_TOKEN.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_SETUP_TOKEN != '' && secrets.PAGES_SETUP_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_SETUP_TOKEN != '' }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
